[package]
name = "SimpleMusicBot"
version = "0.1.0"
edition = "2024"

[lib]
name = "SimpleMusicBot"
path = "src/lib.rs"

[dependencies]
base64 = "0.23.1"
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15.7"
flate2 = "1.1.10"
id3 = "1.17.1"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde_json = "1.0.151"
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
tokio = {version =  "1.53.1", features = ["full"] }
uuid = { version = "1.26.0", features = ["v4"] }
